# Monitoreo y página de estado de Trivia Croydonistas 2026 (producción) con Upptime
# (GitHub Actions + Issues + Pages). Documentación: https://upptime.js.org/docs/configuration
owner: Antisacsor
repo: croydonista-status
user-agent: croydonista-status

# Cada caída abre un issue asignado a esta persona: GitHub le avisa por email.
assignees:
  - pepe0062

# Por defecto Upptime borra los issues de caídas de menos de 15 min; así quedan en el historial.
skipDeleteIssues: true
skipTopicsUpdate: true
skipDescriptionUpdate: true

sites:
  # Revisa que la API responda y que Postgres y Redis estén conectados (ver /health de la API).
  - name: API
    slug: api
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 5000

  - name: Base de datos (Postgres)
    slug: base-de-datos
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"db":true'
    maxResponseTime: 5000

  - name: Caché y sesiones (Redis)
    slug: redis
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"redis":true'
    maxResponseTime: 5000

  # App de la participante: la que croydonistas.com embebe en su iframe.
  - name: App de la participante
    slug: trivia
    url: https://trivia.massivespace.pro
    __dangerous__body_down_if_text_missing: '<div id="root">'
    maxResponseTime: 10000

  # El panel está detrás de autenticación básica de nginx: un 401 significa que está arriba.
  - name: Panel de administración
    slug: admin
    url: https://admin.massivespace.pro
    expectedStatusCodes: [401]
    maxResponseTime: 10000

status-website:
  # Sin dominio propio la página vive en /<repo>; sin esto los assets se piden desde la raíz y no carga.
  baseUrl: /croydonista-status
  name: Trivia Croydonistas 2026
  logoUrl: https://trivia.massivespace.pro/logo/logo_croydon.png
  favicon: https://trivia.massivespace.pro/logo/logo_croydon.png
  theme: light
  # Paleta de Croydon (tokens de apps/web/src/index.css): azul de marca #004c9c, tinta #071a2f,
  # verde #147a3d, alerta #d80d0d, resalte #ffd166, líneas #d8e2ed. Tipografía Inter.
  css: |
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");
    :root {
      --body-background-color: #f4f8fc;
      --body-text-color: #071a2f;
      --card-background-color: #ffffff;
      --card-border-color: #d8e2ed;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #d8e2ed;
      --nav-current-border-bottom-color: #004c9c;
      --up-border-left-color: #147a3d;
      --down-border-left-color: #d80d0d;
      --down-background-color: #fde8e8;
      --degraded-border-left-color: #ffd166;
      --tag-up-background-color: #147a3d;
      --tag-down-background-color: #d80d0d;
      --tag-degraded-background-color: #ffd166;
      --change-background-color: #ffd166;
      --error-button-border-color: #004291;
      --error-button-background-color: #004c9c;
      --error-button-color: #ffffff;
      --submit-button-border-color: #004291;
      --submit-button-background-color: #004c9c;
      --submit-button-color: #ffffff;
    }
    body { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1, h2, h3, h4 { color: #062f68; font-weight: 700; }
    a { color: #004c9c; }
    .tag, [class*="tag"] { color: #ffffff; }
    .tag-degraded { color: #071a2f; }
    nav img, nav .logo { max-height: 36px; width: auto; }
  introTitle: "Estado de **Trivia Croydonistas 2026**"
  introMessage: Revisamos la app de la participante, la API y el panel cada 5 minutos. Si algo falla, aquí lo verás.
  navbar:
    - title: Estado
      href: /

