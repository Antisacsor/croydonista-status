# Monitoreo y página de estado de Trivia Croydonistas 2026 (producción) con Upptime
# (GitHub Actions + Issues + Pages). Documentación: https://upptime.js.org/docs/configuration
owner: Antisacsor
repo: croydonista-status
user-agent: croydonista-status

# Cada caída abre un issue asignado a esta persona: GitHub le avisa por email.
assignees:
  - pepe0062

# Por defecto Upptime borra los issues de caídas de menos de 15 min; así quedan en el historial.
skipDeleteIssues: true
skipTopicsUpdate: true
skipDescriptionUpdate: true

sites:
  # Revisa que la API responda y que Postgres y Redis estén conectados (ver /health de la API).
  - name: API
    slug: api
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 5000

  - name: Base de datos (Postgres)
    slug: base-de-datos
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"db":true'
    maxResponseTime: 5000

  - name: Caché y sesiones (Redis)
    slug: redis
    url: https://api.massivespace.pro/health
    __dangerous__body_down_if_text_missing: '"redis":true'
    maxResponseTime: 5000

  # App de la participante: la que croydonistas.com embebe en su iframe.
  - name: App de la participante
    slug: trivia
    url: https://trivia.massivespace.pro
    __dangerous__body_down_if_text_missing: '<div id="root">'
    maxResponseTime: 10000

  # El panel está detrás de autenticación básica de nginx: un 401 significa que está arriba.
  - name: Panel de administración
    slug: admin
    url: https://admin.massivespace.pro
    expectedStatusCodes: [401]
    maxResponseTime: 10000

status-website:
  name: Trivia Croydonistas 2026
  theme: light
  introTitle: "Estado de **Trivia Croydonistas 2026**"
  introMessage: Revisamos la app de la participante, la API y el panel cada 5 minutos. Si algo falla, aquí lo verás.
  navbar:
    - title: Estado
      href: /

